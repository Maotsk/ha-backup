name: ShellCheck

on:
  push:
    paths:
      - "**/*.sh"
      - ".github/workflows/shellcheck.yml"

  pull_request:
    paths:
      - "**/*.sh"
      - ".github/workflows/shellcheck.yml"

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          severity: warning
